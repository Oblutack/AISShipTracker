<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AIS Ship Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b1120; }
    #map { position: absolute; inset: 0; }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: rgba(15, 23, 42, 0.85); color: #e2e8f0;
      font: 13px/1.4 system-ui, sans-serif; padding: 10px 14px;
      border-radius: 8px; border: 1px solid #334155;
    }
    #hud b { color: #38bdf8; }
    .vessel-icon {
      background: #38bdf8; border: 1px solid #0b1120; border-radius: 50%;
      width: 8px; height: 8px;
    }
    /* Fake a dark basemap from standard (light) OSM tiles. */
    .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }
  </style>
</head>
<body>
  <div id="hud">
    Status: <b id="status">connecting...</b><br />
    Vessels tracked: <b id="count">0</b>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { worldCopyJump: true }).setView([20, 0], 2);
    // Standard OSM tiles - free, no API key required. Inverted via CSS
    // below for a dark look (CARTO's free dark tiles started requiring a
    // key at some point after this was first written).
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
      className: 'dark-tiles',
    }).addTo(map);

    const markers = new Map(); // mmsi -> L.CircleMarker
    const vesselData = new Map(); // mmsi -> latest vessel object, for re-rendering the popup on selection

    // Only one vessel's trail/route is drawn at a time - drawing this for
    // every tracked ship (thousands, globally) would be unusable clutter
    // and a lot of extra fetches. Click a ship to inspect it.
    let selectedMmsi = null;
    let trailLine = null;
    let routeLine = null;

    function clearSelection() {
      if (trailLine) { map.removeLayer(trailLine); trailLine = null; }
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      selectedMmsi = null;
    }

    function popupHtml(v) {
      const name = v.name || `MMSI ${v.mmsi}`;
      const type = v.type_label || 'Unknown type';
      const flag = v.flag || 'Unknown flag';
      const sog = typeof v.sog === 'number' ? v.sog.toFixed(1) : '-';
      const dest = v.destination || '-';
      return `<b>${name}</b><br>${type} &middot; ${flag}<br>Speed: ${sog} kn<br>Destination: ${dest}<br><small>MMSI ${v.mmsi} &middot; click marker for trail/route</small>`;
    }

    async function selectVessel(mmsi) {
      clearSelection();
      selectedMmsi = mmsi;

      // Real position history - the ship's actual reported track.
      try {
        const track = await fetch(`/api/vessels/${mmsi}/track`).then(r => r.json());
        if (Array.isArray(track) && track.length > 1) {
          trailLine = L.polyline(track.map(p => [p.lat, p.lon]), {
            color: '#38bdf8', weight: 2, opacity: 0.8,
          }).addTo(map);
        }
      } catch (e) { console.error('track fetch failed', e); }

      // INFERRED route: a straight great-circle guess to a best-effort
      // matched destination, not a real reported path. Dashed + a
      // different color specifically so it's never confused with the
      // real trail above.
      try {
        const route = await fetch(`/api/vessels/${mmsi}/route`).then(r => r.json());
        if (route && route.matched && Array.isArray(route.path)) {
          routeLine = L.polyline(route.path.map(p => [p[0], p[1]]), {
            color: '#f59e0b', weight: 2, opacity: 0.8, dashArray: '6 8',
          }).addTo(map);
          routeLine.bindPopup(
            `<b>Inferred route</b><br>To: ${route.destination_port.name} (${route.destination_port.locode})<br><small>${route.notice}</small>`
          );
        }
      } catch (e) { console.error('route fetch failed', e); }
    }

    function upsert(v) {
      if (!v || !v.latitude || !v.longitude) return;
      vesselData.set(v.mmsi, v);
      let m = markers.get(v.mmsi);
      if (!m) {
        m = L.circleMarker([v.latitude, v.longitude], {
          radius: 4, color: '#38bdf8', fillColor: '#38bdf8', fillOpacity: 0.9, weight: 1,
        }).addTo(map);
        m.on('click', () => selectVessel(v.mmsi));
        markers.set(v.mmsi, m);
      } else {
        m.setLatLng([v.latitude, v.longitude]);
      }
      m.bindPopup(popupHtml(v));
      document.getElementById('count').textContent = markers.size;
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.onopen = () => { document.getElementById('status').textContent = 'live'; };
      ws.onclose = () => {
        document.getElementById('status').textContent = 'disconnected - retrying...';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();

      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'SNAPSHOT') {
          (msg.data || []).forEach(upsert);
        } else if (msg.type === 'POSITION_UPDATE' || msg.type === 'STATIC_UPDATE') {
          upsert(msg.data);
        }
      };
    }

    connect();
  </script>
</body>
</html>
